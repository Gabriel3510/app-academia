<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#181a22" />
    <title>App Academia</title>
    <meta name="description" content="Planejador de treino semanal com GIFs dos exercícios, trocas inteligentes e acompanhamento de progresso." />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Academia" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
    <script>
      // Applies the theme before first paint so dark mode does not flash white
      try {
        var prefs = JSON.parse(localStorage.getItem('academia-prefs-v2') || 'null');
        var theme = prefs ? prefs.theme : localStorage.getItem('workout-theme');
        var dark = theme === 'dark' || (theme !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
        if (dark) document.documentElement.classList.add('dark');
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
