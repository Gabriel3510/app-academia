<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Workout Plan</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <!-- Splash Screen -->
  <div class="splash-screen" id="splashScreen">
    <div class="splash-content">
      <div class="splash-icon">💪</div>
      <h1 class="splash-title">Seu treino esta pronto</h1>
      <p class="splash-sub">Organizando sua sessao...</p>
      <div class="splash-bar"><div class="splash-fill" id="splashFill"></div></div>
    </div>
  </div>

  <div class="shell">
    <header class="topbar">
      <div class="brand">
        <h1 id="appTitle"></h1>
        <p id="appSubtitle"></p>
      </div>

      <div class="topbar-actions">
        <button class="menu-btn" id="openSettingsBtn" type="button" aria-haspopup="dialog" aria-controls="settingsOverlay" aria-expanded="false">
          <span aria-hidden="true">☰</span>
          <span id="openSettingsLabel"></span>
        </button>
      </div>
    </header>

    <div class="settings-overlay" id="settingsOverlay" aria-hidden="true">
      <aside class="settings-panel" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
        <div class="settings-head">
          <strong id="settingsTitle"></strong>
          <button class="close-btn" id="closeSettingsBtn" type="button">
            <span id="closeSettingsLabel"></span>
          </button>
        </div>

        <div class="settings-content">
          <div class="controls">
            <div class="control-group">
              <span id="languageLabel"></span>
              <div class="segmented" role="group" aria-label="Language selector">
                <button class="segment-btn" type="button" data-lang="en">EN</button>
                <button class="segment-btn" type="button" data-lang="pt">PT</button>
              </div>
            </div>

            <div class="control-group">
              <span id="themeLabel"></span>
              <div class="segmented" role="group" aria-label="Theme toggle">
                <button class="theme-toggle" type="button" id="themeToggleBtn" aria-label="Toggle theme" title="Toggle theme">
                  <span id="themeToggleIcon" aria-hidden="true">🌙</span>
                </button>
              </div>
            </div>
          </div>

          <section class="progress-board" id="todaySection" aria-live="polite">
            <div class="today-strip">
              <div class="today-top">
                <p class="today-day" id="todayDayLabel"></p>
                <span class="today-badge" id="todayBadge"></span>
              </div>
              <p class="today-title" id="todayMainLine"></p>
              <div class="today-meta">
                <span id="todayFocusLine"></span>
                <span id="todayItemsLine"></span>
              </div>
            </div>
            <div class="progress-head">
              <div class="progress-title">
                <strong id="progressTitle"></strong>
                <span id="progressSubtitle"></span>
              </div>
              <button class="reset-btn" id="resetWeekBtn" type="button"></button>
            </div>
            <div class="progress-track">
              <div class="progress-fill" id="weekProgressBar"></div>
            </div>
            <p class="progress-text" id="weekProgressText"></p>
            <div class="days-tracker" id="daysTracker"></div>
            <div class="progress-summary">
              <p id="todayStatus"></p>
              <p id="doneDaysText"></p>
              <p id="missingDaysText"></p>
              <p id="pendingDaysText"></p>
            </div>
          </section>

          <section class="group-board" aria-live="polite">
            <div class="group-head">
              <div>
                <strong id="groupTitle"></strong>
                <p id="groupSubtitle"></p>
              </div>
            </div>
            <div class="group-controls">
              <label for="groupSelect" id="groupLabel"></label>
              <select id="groupSelect"></select>
              <label for="groupSwapPolicySelect" id="groupSwapPolicyLabel"></label>
              <select id="groupSwapPolicySelect"></select>
              <label for="groupEquipmentSelect" id="groupEquipmentLabel"></label>
              <select id="groupEquipmentSelect"></select>
              <label for="groupLevelSelect" id="groupLevelLabel"></label>
              <select id="groupLevelSelect"></select>
              <label for="groupObjectiveSelect" id="groupObjectiveLabel"></label>
              <select id="groupObjectiveSelect"></select>
            </div>
            <div class="group-actions">
              <button class="pill-btn" id="newGroupBtn" type="button"></button>
              <button class="pill-btn" id="duplicateGroupBtn" type="button"></button>
              <button class="pill-btn danger" id="deleteGroupBtn" type="button"></button>
            </div>
            <p class="group-efficiency" id="groupEfficiency"></p>
          </section>

          <footer class="footer" id="aboutSection">
            <p id="footerLine1"></p>
            <p id="footerCredit"></p>
          </footer>
        </div>
      </aside>
    </div>

    <div class="onboarding-modal" id="onboardingModal" aria-hidden="true">
      <div class="onboarding-card" role="dialog" aria-modal="true" aria-labelledby="onboardingTitle">
        <div class="onboarding-head">
          <strong id="onboardingTitle"></strong>
          <p id="onboardingSubtitle"></p>
        </div>
        <form id="onboardingForm" class="onboarding-form">
          <div class="onboarding-field">
            <label for="onboardingName" id="onboardingNameLabel"></label>
            <input id="onboardingName" type="text" maxlength="40" />
          </div>
          <div class="onboarding-field">
            <label for="onboardingGoal" id="onboardingGoalLabel"></label>
            <select id="onboardingGoal"></select>
          </div>
          <div class="onboarding-field">
            <label for="onboardingLevel" id="onboardingLevelLabel"></label>
            <select id="onboardingLevel"></select>
          </div>
          <div class="onboarding-field">
            <label for="onboardingEquipment" id="onboardingEquipmentLabel"></label>
            <select id="onboardingEquipment"></select>
          </div>
          <div class="onboarding-field">
            <label for="onboardingSessions" id="onboardingSessionsLabel"></label>
            <select id="onboardingSessions"></select>
          </div>
          <button class="onboarding-submit" id="onboardingSubmitBtn" type="submit"></button>
        </form>
      </div>
    </div>

    <main class="grid" id="planRoot"></main>
  </div>

  <div class="preview-modal" id="previewModal" aria-hidden="true">
    <div class="preview-card" role="dialog" aria-modal="true" aria-labelledby="previewExerciseName">
      <div class="preview-head">
        <div class="preview-title">
          <strong id="previewExerciseName"></strong>
          <span id="previewExerciseSets"></span>
        </div>
        <button class="close-btn" id="closePreviewBtn" type="button"></button>
      </div>
      <div class="preview-media">
        <img id="previewImage" src="" alt="" />
      </div>
      <div class="preview-foot" id="previewHint"></div>
    </div>
  </div>

    function clonePlan(plan) {
      return JSON.parse(JSON.stringify(plan));
    }

    function loadWorkoutGroups() {
      try {
        const raw = localStorage.getItem("workout-groups-v1");
        if (!raw) {
          return [];
        }
        const parsed = JSON.parse(raw);
        if (!Array.isArray(parsed)) {
          return [];
        }
        return parsed.filter((group) => {
          return group && typeof group.id === "string" && typeof group.name === "string" && Array.isArray(group.plan);
        }).map((group) => ({
          ...group,
          swapPolicy: normalizeSwapPolicy(group.swapPolicy),
          equipmentProfile: normalizeEquipmentProfile(group.equipmentProfile),
          levelProfile: normalizeLevelProfile(group.levelProfile),
          objectiveProfile: normalizeObjectiveProfile(group.objectiveProfile)
        }));
      } catch {
        return [];
      }
    }

    function normalizeSwapPolicy(policy) {
      if (policy === "strict" || policy === "moderate" || policy === "flexible") {
        return policy;
      }
      return "moderate";
    }

    function normalizeEquipmentProfile(profile) {
      if (profile === "gym" || profile === "home" || profile === "mixed") {
        return profile;
      }
      return "mixed";
    }

    function normalizeLevelProfile(level) {
      if (level === "beginner" || level === "intermediate" || level === "advanced") {
        return level;
      }
      return "intermediate";
    }

    function normalizeObjectiveProfile(profile) {
      if (profile === "balanced" || profile === "hypertrophy" || profile === "fatloss" || profile === "endurance") {
        return profile;
      }
      return "balanced";
    }

    function normalizeSessionsWeekly(value) {
      const parsed = Number(value);
      if (parsed === 3 || parsed === 4 || parsed === 5) {
        return parsed;
      }
      return 4;
    }

    function loadOnboardingProfile() {
      try {
        const raw = localStorage.getItem("workout-onboarding-v1");
        if (!raw) {
          return null;
        }
        const parsed = JSON.parse(raw);
        if (!parsed || typeof parsed !== "object") {
          return null;
        }
        return {
          name: typeof parsed.name === "string" ? parsed.name : "",
          objectiveProfile: normalizeObjectiveProfile(parsed.objectiveProfile),
          levelProfile: normalizeLevelProfile(parsed.levelProfile),
          equipmentProfile: normalizeEquipmentProfile(parsed.equipmentProfile),
          sessionsWeekly: normalizeSessionsWeekly(parsed.sessionsWeekly)
        };
      } catch {
        return null;
      }
    }

    function saveOnboardingProfile(profile) {
      localStorage.setItem("workout-onboarding-v1", JSON.stringify(profile));
    }

    function chooseExerciseByFilters(dayKey, baseExercise, profile) {
      const candidates = [
        { name: baseExercise.name, file: baseExercise.file },
        ...(exerciseVariants[baseExercise.name] || [])
      ];

      const seen = new Set();
      const uniqueCandidates = candidates.filter((candidate) => {
        if (seen.has(candidate.name)) {
          return false;
        }
        seen.add(candidate.name);
        return true;
      });

      const allowedByEquipment = uniqueCandidates.filter((candidate) => {
        if (profile.equipmentProfile === "mixed") {
          return true;
        }
        const equipment = exerciseEquipment[candidate.name] || ["home", "gym"];
        return equipment.includes(profile.equipmentProfile);
      });

      const objectiveFiltered = allowedByEquipment.filter((candidate) => {
        if (profile.objectiveProfile === "balanced") {
          return true;
        }
        const tags = exerciseObjectives[candidate.name] || ["hypertrophy", "fatloss", "endurance"];
        return tags.includes(profile.objectiveProfile);
      });

      const dayFiltered = objectiveFiltered.filter((candidate) => {
        const families = exerciseFamilies[candidate.name] || [];
        const allowedFamilies = getAllowedFamiliesForDay(dayKey);
        if (!families.length) {
          return true;
        }
        return families.some((family) => allowedFamilies.has(family));
      });

      return dayFiltered[0] || objectiveFiltered[0] || allowedByEquipment[0] || uniqueCandidates[0];
    }

    function adjustSetsByLevel(sets, level) {
      const match = sets.match(/^(\d+)\s*x\s*(.+)$/i);
      if (!match) {
        return sets;
      }
      const amount = Number(match[1]);
      const detail = match[2];
      if (level === "beginner") {
        return `${Math.max(2, amount - 1)} x ${detail}`;
      }
      if (level === "advanced") {
        return `${amount + 1} x ${detail}`;
      }
      return sets;
    }

    function adjustSetsByGoal(sets, objective) {
      if (objective === "fatloss" || objective === "endurance") {
        return sets
          .replace("10-12", "12-15")
          .replace("3 x 10", "3 x 12-15")
          .replace("3 x 12", "3 x 15")
          .replace("30-60s", "45-75s");
      }
      if (objective === "hypertrophy") {
        return sets
          .replace("12-15", "8-12")
          .replace("3 x 15", "4 x 10-12");
      }
      return sets;
    }

    function buildPersonalizedPlan(profile) {
      const personalizedPlan = clonePlan(basePlanData);
      for (const day of personalizedPlan) {
        if (!Array.isArray(day.exercises)) {
          continue;
        }

        for (const exercise of day.exercises) {
          const chosen = chooseExerciseByFilters(day.key, exercise, profile);
          exercise.name = chosen.name;
          exercise.file = chosen.file;
          exercise.sets = adjustSetsByGoal(adjustSetsByLevel(exercise.sets, profile.levelProfile), profile.objectiveProfile);
        }

        if ((profile.objectiveProfile === "fatloss" || profile.objectiveProfile === "endurance") && day.kind !== "cardio") {
          const hasConditioning = day.exercises.some((exercise) => exercise.name === "mountainClimber");

              name: "mountainClimber",
              sets: profile.objectiveProfile === "endurance" ? "4 x 40s" : "3 x 30-45s",
              file: "mountain-climber.gif"
            });
          }
        }
      }

      return personalizedPlan;
    }

    function getGroupEfficiencySummary(plan, language) {
      const t = translations[language];
      const counts = { push: 0, pull: 0, legs: 0, cardio: 0 };
      let totalExerciseItems = 0;
      let repeatedFocusPenalty = 0;

      for (let index = 0; index < plan.length; index += 1) {
        const day = plan[index];
        counts[day.focusKey] = (counts[day.focusKey] || 0) + 1;
        if (Array.isArray(day.exercises)) {
          totalExerciseItems += day.exercises.length;
        }

        const previousDay = plan[index - 1];
        if (previousDay && previousDay.focusKey === day.focusKey && day.focusKey !== "cardio") {
          repeatedFocusPenalty += 8;
        }
      }

      let score = 100;
      if (!counts.cardio) score -= 12;
      if (!counts.push || !counts.pull || !counts.legs) score -= 18;
      if (Math.abs(counts.push - counts.pull) > 1) score -= 8;
      if (totalExerciseItems < 14) score -= 10;
      if (totalExerciseItems > 34) score -= 10;
      score -= repeatedFocusPenalty;
      score = Math.max(0, Math.min(100, score));

      if (score >= 85) {
        return {
          score,
          label: t.groupEfficiencyExcellent,
          hint: t.groupEfficiencyHintExcellent,
          tone: "excellent"
        };
      }

      if (score >= 70) {
        return {
          score,
          label: t.groupEfficiencyGood,
          hint: t.groupEfficiencyHintGood,
          tone: "good"
        };
      }

      return {
        score,
        label: t.groupEfficiencyAdjust,
        hint: t.groupEfficiencyHintAdjust,
        tone: "adjust"
      };
    }

    function clearDayManualState(dayKey) {

    function moveExerciseChoiceBetweenDays(exerciseName, fromDayKey, toDayKey) {
      const oldChoiceKey = getExerciseSlotKey(fromDayKey, exerciseName);
      const variantName = exerciseChoices[oldChoiceKey];
      delete exerciseChoices[oldChoiceKey];

      if (!variantName) {
        return;
      }

      const newChoiceKey = getExerciseSlotKey(toDayKey, exerciseName);
      if (!exerciseChoices[newChoiceKey]) {
        exerciseChoices[newChoiceKey] = variantName;
      }
    }

    function clearProgressForMovedExercise(exerciseName, fromDayKey, toDayKey) {
      const itemId = `exercise:${exerciseName}`;
      delete progressState[getItemProgressKey(fromDayKey, itemId)];
      delete progressState[getItemProgressKey(toDayKey, itemId)];
      clearDayManualState(fromDayKey);
      clearDayManualState(toDayKey);
    }

    function moveExerciseSlot(fromDayKey, toDayKey, oldIndex, newIndex) {
      const group = getActiveGroup();
      if (!group) {
        return;
      }

      const fromDay = group.plan.find((day) => day.key === fromDayKey);
      const toDay = group.plan.find((day) => day.key === toDayKey);
      if (!fromDay || !toDay || !Array.isArray(fromDay.exercises) || !Array.isArray(toDay.exercises)) {
        return;
      }

      const [movedExercise] = fromDay.exercises.splice(oldIndex, 1);
      if (!movedExercise) {
        return;
      }

      toDay.exercises.splice(newIndex, 0, movedExercise);

      if (fromDayKey !== toDayKey) {
        moveExerciseChoiceBetweenDays(movedExercise.name, fromDayKey, toDayKey);
        clearProgressForMovedExercise(movedExercise.name, fromDayKey, toDayKey);
      }

      saveExerciseChoices(exerciseChoices);
      saveWeekProgress();
      saveWorkoutGroups();
      renderPlan(currentLanguage);
    }

    function teardownSortables() {

      exerciseSortables = [];
    }

    function initExerciseSortables() {
      teardownSortables();
      if (typeof Sortable === "undefined") {
        return;
      }

      const grids = [...document.querySelectorAll(".exercise-grid")];
      for (const grid of grids) {
        const sortable = Sortable.create(grid, {
          animation: 160,
          group: "exercise-slots",
          draggable: ".exercise",
          handle: ".exercise-media",
          ghostClass: "drag-ghost",
          chosenClass: "drag-chosen",
          dragClass: "drag-active",
          onEnd: (event) => {
            if (typeof event.oldIndex !== "number" || typeof event.newIndex !== "number") {
              return;
            }

            const fromDayKey = event.from.dataset.dayKey;
            const toDayKey = event.to.dataset.dayKey;
            if (!fromDayKey || !toDayKey) {
              return;
            }

            if (fromDayKey === toDayKey && event.oldIndex === event.newIndex) {
              return;
            }

            moveExerciseSlot(fromDayKey, toDayKey, event.oldIndex, event.newIndex);
          }
        });

        exerciseSortables.push(sortable);
      }
    }

    function getExerciseSlotKey(dayKey, baseExerciseName) {
      return `${dayKey}:${baseExerciseName}`;
    }

    function getAllowedFamiliesForDay(dayKey) {
      const day = getDayByKey(dayKey);
      const activeGroup = getActiveGroup();
      const policy = normalizeSwapPolicy(activeGroup ? activeGroup.swapPolicy : "moderate");
      const focusKey = day ? day.focusKey : "push";
      const allowed = swapPolicyRules[policy][focusKey] || swapPolicyRules.moderate[focusKey] || [];
      return new Set(allowed);
    }

    function isVariantAllowedForDay(dayKey, exerciseName) {
      const families = exerciseFamilies[exerciseName] || [];
      const allowedFamilies = getAllowedFamiliesForDay(dayKey);
      if (!families.length) {
        return true;
      }
      return families.some((family) => allowedFamilies.has(family));
    }

    function isVariantAllowedByEquipment(exerciseName) {
      const activeGroup = getActiveGroup();
      const profile = normalizeEquipmentProfile(activeGroup ? activeGroup.equipmentProfile : "mixed");
      if (profile === "mixed") {
        return true;
      }

      const equipment = exerciseEquipment[exerciseName] || ["home", "gym"];
      return equipment.includes(profile);
    }

    function isVariantAllowedByLevel(exerciseName) {
      const activeGroup = getActiveGroup();
      const targetLevel = normalizeLevelProfile(activeGroup ? activeGroup.levelProfile : "intermediate");
      const maxRank = levelOrder[targetLevel] || levelOrder.intermediate;
      const exerciseLevel = exerciseLevels[exerciseName] || "intermediate";
      const exerciseRank = levelOrder[exerciseLevel] || levelOrder.intermediate;
      return exerciseRank <= maxRank;
    }

    function isVariantAllowedByObjective(exerciseName) {
      const activeGroup = getActiveGroup();
      const objective = normalizeObjectiveProfile(activeGroup ? activeGroup.objectiveProfile : "balanced");
      if (objective === "balanced") {
        return true;
      }

      const tags = exerciseObjectives[exerciseName] || ["hypertrophy", "fatloss", "endurance"];
      return tags.includes(objective);
    }

    function getExerciseOptions(dayKey, baseExercise) {
      const options = exerciseVariants[baseExercise.name] || [{ name: baseExercise.name, file: baseExercise.file }];
      const filtered = options.filter((option) => {
        if (option.name === baseExercise.name) {
          return true;
        }
        return isVariantAllowedForDay(dayKey, option.name)
          && isVariantAllowedByEquipment(option.name)
          && isVariantAllowedByLevel(option.name)
          && isVariantAllowedByObjective(option.name);
      });

      if (!filtered.length) {
        return [{ name: baseExercise.name, file: baseExercise.file }];
      }

      return filtered;
    }

    function resolveExerciseVariant(dayKey, baseExercise) {
      const options = getExerciseOptions(dayKey, baseExercise);
      const slotKey = getExerciseSlotKey(dayKey, baseExercise.name);
      const storedChoice = exerciseChoices[slotKey];
      const found = options.find((option) => option.name === storedChoice);
      return found || options[0];
    }

    function setExerciseVariant(dayKey, baseExercise, variantName) {
      const slotKey = getExerciseSlotKey(dayKey, baseExercise.name);
      if (variantName === baseExercise.name) {
        delete exerciseChoices[slotKey];
      } else {
        exerciseChoices[slotKey] = variantName;
      }
      saveExerciseChoices(exerciseChoices);
      renderPlan(currentLanguage);
    }

    function getWeekStart(date = new Date()) {
      const start = new Date(date);
      start.setHours(0, 0, 0, 0);
      const weekday = start.getDay();
      const diff = weekday === 0 ? -6 : 1 - weekday;
      start.setDate(start.getDate() + diff);
      return start;
    }

    function getWeekKey() {
      return getWeekStart().toISOString().slice(0, 10);
    }

    function normalizeProgressState(rawState) {
      const normalized = {};
      if (!rawState || typeof rawState !== "object") {
        return normalized;
      }

      for (const [key, value] of Object.entries(rawState)) {
        if (value !== "done") {
          continue;
        }

        if (key.startsWith("day:") || key.startsWith("item:")) {
          normalized[key] = "done";
          continue;
        }

        if (weekDays.includes(key)) {
          normalized[`day:${key}`] = "done";
        }
      }

      return normalized;
    }

    function loadWeekProgress() {
      const key = getWeekKey();
      const raw = localStorage.getItem(`workout-progress-${key}`);
      if (!raw) {
        return {};
      }
      try {
        const parsed = JSON.parse(raw);
        return normalizeProgressState(parsed);
      } catch {
        return {};
      }
    }

    function saveWeekProgress() {
      localStorage.setItem(`workout-progress-${currentWeekKey}`, JSON.stringify(progressState));
    }

    function syncWeekProgress() {
      const liveWeek = getWeekKey();
      if (liveWeek !== currentWeekKey) {
        currentWeekKey = liveWeek;
        progressState = loadWeekProgress();
      }
    }

    function getTodayPlanKey() {
      return todayToPlan[new Date().getDay()] || null;
    }

    function getDayByKey(dayKey) {
      const plan = getActivePlan();
      return plan.find((day) => day.key === dayKey) || null;
    }

    function getDayItemIds(day) {
      const ids = [];
      if (day.exercises) {
        for (const exercise of day.exercises) {
          ids.push(`exercise:${exercise.name}`);
        }
      }
      if (day.cardio) {
        for (let index = 0; index < day.cardio.length; index += 1) {
          ids.push(`cardio:${index}`);
        }
      }
      return ids;
    }

    function getItemProgressKey(dayKey, itemId) {
      return `item:${dayKey}:${itemId}`;
    }

    function isItemDone(dayKey, itemId) {
      return progressState[getItemProgressKey(dayKey, itemId)] === "done";
    }

    function isDayManualDone(dayKey) {
      return progressState[`day:${dayKey}`] === "done";
    }

    function isDayDone(dayKey) {
      if (isDayManualDone(dayKey)) {
        return true;
      }

      const day = getDayByKey(dayKey);
      if (!day) {
        return false;
      }

      const itemIds = getDayItemIds(day);
      if (!itemIds.length) {
        return false;
      }

      return itemIds.every((itemId) => isItemDone(dayKey, itemId));
    }

    function getDayProgressCount(dayKey) {
      const day = getDayByKey(dayKey);
      if (!day) {
        return { done: 0, total: 0 };
      }

      const itemIds = getDayItemIds(day);
      const done = itemIds.filter((itemId) => isItemDone(dayKey, itemId)).length;
      return { done, total: itemIds.length };
    }

    function getEffectiveStatus(dayKey) {
      if (isDayDone(dayKey)) {
        return "done";
      }

      const todayKey = getTodayPlanKey();
      const todayIndex = todayKey ? weekDays.indexOf(todayKey) : -1;
      const dayIndex = weekDays.indexOf(dayKey);

      if (todayIndex >= 0 && dayIndex < todayIndex) {
        return "missed";
      }

      return "pending";
    }

    function toggleDayDone(dayKey) {
      syncWeekProgress();
      const manualKey = `day:${dayKey}`;
      if (progressState[manualKey] === "done") {
        delete progressState[manualKey];
      } else {
        progressState[manualKey] = "done";
      }
      saveWeekProgress();
      renderPlan(currentLanguage);
    }

    function toggleItemDone(dayKey, itemId) {
      syncWeekProgress();
      const progressKey = getItemProgressKey(dayKey, itemId);
      if (progressState[progressKey] === "done") {
        delete progressState[progressKey];
      } else {
        progressState[progressKey] = "done";
      }
      saveWeekProgress();
      renderPlan(currentLanguage);
    }

    function isDayCollapsed(dayKey) {
      return collapsedDays[dayKey] === true;
    }

    function toggleDayCollapsed(dayKey) {
      if (isDayCollapsed(dayKey)) {
        delete collapsedDays[dayKey];
      } else {
        collapsedDays[dayKey] = true;
      }
      saveCollapsedDays(collapsedDays);
      renderPlan(currentLanguage);
    }

    function dayListToText(dayList, t) {
      if (!dayList.length) {
        return t.noneLabel;
      }
      return dayList.map((key) => t.days[key]).join(", ");
    }

    function renderProgress(language) {
      syncWeekProgress();
      const t = translations[language];
      const doneDays = [];
      const missedDays = [];
      const pendingDays = [];

      daysTracker.innerHTML = "";

      for (const key of weekDays) {
        const status = getEffectiveStatus(key);
        if (status === "done") doneDays.push(key);
        if (status === "missed") missedDays.push(key);
        if (status === "pending") pendingDays.push(key);

        const dayBtn = document.createElement("button");
        dayBtn.type = "button";
        dayBtn.className = "track-day";
        dayBtn.dataset.status = status;
        dayBtn.innerHTML = `
          <span>${t.dayShort[key]}</span>
          <strong>${status === "done" ? "✓" : status === "missed" ? "✕" : "•"}</strong>
        `;
        dayBtn.setAttribute("aria-label", `${t.days[key]} - ${status}`);
        dayBtn.addEventListener("click", () => toggleDayDone(key));
        daysTracker.appendChild(dayBtn);
      }

      const completion = Math.round((doneDays.length / weekDays.length) * 100);
      weekProgressBar.style.width = `${completion}%`;
      weekProgressText.textContent = `${t.weekProgress}: ${doneDays.length}/${weekDays.length} (${completion}%)`;

      const todayKey = getTodayPlanKey();
      if (!todayKey) {
        todayStatus.textContent = t.todayRest;
        todayDayLabel.textContent = t.todayRestTitle;
        todayBadge.textContent = t.statusPending;
        todayMainLine.textContent = t.todayRest;
        todayFocusLine.textContent = `${t.todayFocusLabel}: -`;
        todayItemsLine.textContent = `${t.todayItemsLabel}: 0/0`;
      } else {
        const todayDay = getDayByKey(todayKey);
        const todayProgress = getDayProgressCount(todayKey);
        const todayState = getEffectiveStatus(todayKey);
        if (todayState === "done") {
          todayStatus.textContent = t.todayDone;
          todayBadge.textContent = t.statusDone;
        } else if (todayState === "missed") {
          todayStatus.textContent = t.todayMissed;
          todayBadge.textContent = t.statusMissed;
        } else {
          todayStatus.textContent = t.todayPending;
          todayBadge.textContent = t.statusPending;
        }

        todayDayLabel.textContent = t.days[todayKey];
        todayMainLine.textContent = todayStatus.textContent;
        todayFocusLine.textContent = `${t.todayFocusLabel}: ${t.focuses[todayDay.focusKey]}`;
        todayItemsLine.textContent = `${t.todayItemsLabel}: ${todayProgress.done}/${todayProgress.total}`;
      }

      doneDaysText.textContent = `${t.doneListLabel} ${dayListToText(doneDays, t)}`;
      missingDaysText.textContent = `${t.missedListLabel} ${dayListToText(missedDays, t)}`;
      pendingDaysText.textContent = `${t.pendingListLabel} ${dayListToText(pendingDays, t)}`;

      progressTitle.textContent = t.progressTitle;
      progressSubtitle.textContent = t.progressSubtitle;
      resetWeekBtn.textContent = t.resetWeek;
    }

    function setActiveButton(buttons, value, attr) {
      for (const button of buttons) {
        button.classList.toggle("active", button.getAttribute(attr) === value);
      }
    }

    function applyTheme(theme) {
      currentTheme = theme;
      document.documentElement.setAttribute("data-theme", theme);
      localStorage.setItem("workout-theme", theme);

      const t = translations[currentLanguage] || translations.en;
      const isDark = theme === "dark";
      themeToggleIcon.textContent = isDark ? "☀️" : "🌙";
      themeToggleBtn.setAttribute("aria-label", isDark ? t.themeToggleToLight : t.themeToggleToDark);
      themeToggleBtn.title = isDark ? t.themeToggleToLight : t.themeToggleToDark;
    }

    function openPreview(exercise, t) {
      previewExerciseName.textContent = t.exercises[exercise.name];
      previewExerciseSets.textContent = exercise.sets;
      previewImage.src = `gifs/${exercise.file}`;
      previewImage.alt = t.exercises[exercise.name];
      previewHint.textContent = t.previewHint;
      closePreviewBtn.textContent = t.closeLabel;

      previewModal.classList.add("open");
      previewModal.setAttribute("aria-hidden", "false");
      document.body.classList.add("modal-open");
    }

    function closePreview() {
      previewModal.classList.remove("open");
      previewModal.setAttribute("aria-hidden", "true");
      previewImage.src = "";
      if (!onboardingModal.classList.contains("open")) {
        document.body.classList.remove("modal-open");
      }
    }

    function openSettingsPanel() {
      settingsOverlay.classList.add("open");
      settingsOverlay.setAttribute("aria-hidden", "false");
      openSettingsBtn.setAttribute("aria-expanded", "true");
      document.body.classList.add("settings-open");
    }

    function closeSettingsPanel() {
      settingsOverlay.classList.remove("open");
      settingsOverlay.setAttribute("aria-hidden", "true");
      openSettingsBtn.setAttribute("aria-expanded", "false");
      document.body.classList.remove("settings-open");
    }

    function renderPlan(language) {
      currentLanguage = language;
      const t = translations[language];
      planRoot.innerHTML = "";

      document.documentElement.lang = language === "pt" ? "pt" : "en";
      document.title = t.title;
      document.getElementById("appTitle").textContent = t.title;
      document.getElementById("appSubtitle").textContent = t.subtitle;
      document.getElementById("languageLabel").textContent = t.languageLabel;
      document.getElementById("themeLabel").textContent = t.themeLabel;
      openSettingsLabel.textContent = t.menuLabel;
      settingsTitle.textContent = t.settingsTitle;
      closeSettingsLabel.textContent = t.settingsClose;
      document.getElementById("footerLine1").textContent = t.footerLine1;
      document.getElementById("footerCredit").textContent = t.footerCredit;
      closePreviewBtn.textContent = t.closeLabel;
      previewHint.textContent = t.previewHint;
      updateOnboardingText(language);
      renderProgress(language);
      applyTheme(currentTheme);
      updateGroupSelect(language);
      renderGroupEfficiency(language);

      for (const day of getActivePlan()) {
        const dayCard = document.createElement("section");
        dayCard.className = "day-card";
        dayCard.dataset.kind = day.kind;
        dayCard.dataset.span = day.span;
        const collapsed = isDayCollapsed(day.key);
        dayCard.dataset.collapsed = collapsed ? "true" : "false";

        const head = document.createElement("header");
        head.className = "day-head";
        const dayStatus = getEffectiveStatus(day.key);
        const dayProgress = getDayProgressCount(day.key);

        head.innerHTML = `
          <div class="day-title"><span>${dayIcons[day.key]}</span><span>${t.days[day.key]}</span></div>
          <div class="day-head-right">
            <div class="day-focus">${t.focuses[day.focusKey]}</div>
            <div class="day-progress-mini">${dayProgress.done}/${dayProgress.total} ${t.dayItemsDone}</div>
            <div class="day-head-actions">
              <button class="collapse-toggle" type="button" data-toggle-collapse="${day.key}" aria-expanded="${collapsed ? "false" : "true"}">
                <span class="collapse-toggle-icon" aria-hidden="true">${collapsed ? "+" : "-"}</span>
                <span>${collapsed ? t.expandDay : t.collapseDay}</span>
              </button>
              <button class="complete-toggle ${dayStatus === "done" ? "is-done" : ""}" type="button" data-day-key="${day.key}">
                ${dayStatus === "done" ? t.markUndo : t.markDone}
              </button>
            </div>
          </div>
        `;
        dayCard.appendChild(head);

        const toggleBtn = head.querySelector("[data-day-key]");
        if (toggleBtn) {
          toggleBtn.addEventListener("click", () => toggleDayDone(day.key));
        }

        const collapseBtn = head.querySelector("[data-toggle-collapse]");
        if (collapseBtn) {
          collapseBtn.addEventListener("click", () => toggleDayCollapsed(day.key));
        }

        const content = document.createElement("div");
        content.className = "day-content";
        content.hidden = collapsed;

        if (day.exercises) {
          const grid = document.createElement("div");
          grid.className = "exercise-grid";
          grid.dataset.dayKey = day.key;

          for (const exercise of day.exercises) {
            const itemId = `exercise:${exercise.name}`;
            const done = isItemDone(day.key, itemId);
            const selectedVariant = resolveExerciseVariant(day.key, exercise);
            const variantOptions = getExerciseOptions(day.key, exercise);
            const optionMarkup = variantOptions
              .map((option) => {
                const optionLabel = t.exercises[option.name] || option.name;
                const isSelected = option.name === selectedVariant.name ? "selected" : "";
                return `<option value="${option.name}" ${isSelected}>${optionLabel}</option>`;
              })
              .join("");
            const card = document.createElement("article");
            card.className = `exercise ${done ? "is-complete" : ""}`;
            card.dataset.exerciseName = exercise.name;
            card.tabIndex = 0;
            card.setAttribute("role", "button");
            card.setAttribute("aria-label", `${t.exercises[selectedVariant.name] || selectedVariant.name} - ${exercise.sets}`);

            card.innerHTML = `
              <span class="expand-hint">${t.zoomTag}</span>
              <div class="exercise-media">
                <img src="gifs/${selectedVariant.file}" alt="${t.exercises[selectedVariant.name] || selectedVariant.name}" onerror="showFallback(this)" />
                <div class="fallback">${t.fallback}</div>
              </div>
              <div class="exercise-body">
                <div class="exercise-name">${t.exercises[selectedVariant.name] || selectedVariant.name}</div>
                <div class="exercise-meta">${exercise.sets}</div>
                ${exercise.updated ? `<div class="exercise-note">${t.updatedTag}</div>` : ""}
                <div class="exercise-actions">
                  <div class="variation-wrap">
                    <label>${t.variationLabel}</label>
                    <select class="variation-select" data-variation-select="${itemId}">
                      ${optionMarkup}
                    </select>
                  </div>
                  <button class="item-toggle ${done ? "is-done" : ""}" type="button" data-toggle-item="${itemId}">
                    ${done ? t.markExerciseUndo : t.markExerciseDone}
                  </button>
                </div>
              </div>
            `;

            card.addEventListener("click", () => openPreview({ name: selectedVariant.name, sets: exercise.sets, file: selectedVariant.file }, t));
            card.addEventListener("keydown", (event) => {
              if (event.key === "Enter" || event.key === " ") {
                event.preventDefault();
                openPreview({ name: selectedVariant.name, sets: exercise.sets, file: selectedVariant.file }, t);
              }
            });

            const variationSelect = card.querySelector("[data-variation-select]");
            if (variationSelect) {
              variationSelect.addEventListener("click", (event) => {
                event.stopPropagation();
              });
              variationSelect.addEventListener("change", (event) => {
                event.stopPropagation();
                setExerciseVariant(day.key, exercise, variationSelect.value);
              });
            }

            const itemToggle = card.querySelector("[data-toggle-item]");
            if (itemToggle) {
              itemToggle.addEventListener("click", (event) => {
                event.stopPropagation();
                toggleItemDone(day.key, itemId);
              });
            }

            grid.appendChild(card);
          }

          content.appendChild(grid);
        }

        if (day.cardio) {
          const list = document.createElement("div");
          list.className = "cardio-list";

          for (let index = 0; index < day.cardio.length; index += 1) {
            const item = day.cardio[index];
            const itemId = `cardio:${index}`;
            const done = isItemDone(day.key, itemId);
            const row = document.createElement("article");
            row.className = `cardio-item ${done ? "is-complete" : ""}`;
            row.innerHTML = `
              <div>
                <div class="cardio-title">${t.cardio[item.title]}</div>
                <div class="cardio-sub">${t.cardio[item.detail]}</div>
              </div>
              <div class="duration">${t.durations[item.duration]}</div>
              <button class="item-toggle ${done ? "is-done" : ""}" type="button" data-toggle-item="${itemId}">
                ${done ? t.markExerciseUndo : t.markExerciseDone}
              </button>
            `;

            const itemToggle = row.querySelector("[data-toggle-item]");
            if (itemToggle) {
              itemToggle.addEventListener("click", () => {
                toggleItemDone(day.key, itemId);
              });
            }
            list.appendChild(row);
          }

          content.appendChild(list);
        }

        if (day.tipKey) {
          const tip = document.createElement("div");
          tip.className = "tip";
          tip.textContent = `${t.tipLabel}: ${t.tips[day.tipKey]}`;
          content.appendChild(tip);
        }

        dayCard.appendChild(content);

        planRoot.appendChild(dayCard);
      }

      setActiveButton(languageButtons, language, "data-lang");
      initExerciseSortables();
    }

    function showFallback(img) {
      img.style.display = "none";
      const fallback = img.parentElement.querySelector(".fallback");
      if (fallback) {
        fallback.style.display = "flex";
      }
    }

    for (const button of languageButtons) {
      button.addEventListener("click", () => {
        const language = button.getAttribute("data-lang");
        localStorage.setItem("workout-language", language);
        renderPlan(language);
      });
    }

    themeToggleBtn.addEventListener("click", () => {
      applyTheme(currentTheme === "dark" ? "light" : "dark");
    });

    openSettingsBtn.addEventListener("click", () => {
      if (onboardingModal.classList.contains("open")) {
        return;
      }
      openSettingsPanel();
    });

    closeSettingsBtn.addEventListener("click", () => {
      closeSettingsPanel();
    });

    settingsOverlay.addEventListener("click", (event) => {
      if (event.target === settingsOverlay) {
        closeSettingsPanel();
      }
    });

    groupSelect.addEventListener("change", () => {
      activeGroupId = groupSelect.value;
      saveWorkoutGroups();
      renderPlan(currentLanguage);
    });

    groupSwapPolicySelect.addEventListener("change", () => {
      const activeGroup = getActiveGroup();
      if (!activeGroup) {
        return;
      }
      activeGroup.swapPolicy = normalizeSwapPolicy(groupSwapPolicySelect.value);
      saveWorkoutGroups();
      renderPlan(currentLanguage);
    });

    groupEquipmentSelect.addEventListener("change", () => {
      const activeGroup = getActiveGroup();
      if (!activeGroup) {
        return;
      }
      activeGroup.equipmentProfile = normalizeEquipmentProfile(groupEquipmentSelect.value);
      saveWorkoutGroups();
      renderPlan(currentLanguage);
    });

    groupLevelSelect.addEventListener("change", () => {
      const activeGroup = getActiveGroup();
      if (!activeGroup) {
        return;
      }
      activeGroup.levelProfile = normalizeLevelProfile(groupLevelSelect.value);
      saveWorkoutGroups();
      renderPlan(currentLanguage);
    });

    groupObjectiveSelect.addEventListener("change", () => {
      const activeGroup = getActiveGroup();
      if (!activeGroup) {
        return;
      }
      activeGroup.objectiveProfile = normalizeObjectiveProfile(groupObjectiveSelect.value);
      saveWorkoutGroups();
      renderPlan(currentLanguage);
    });

    onboardingForm.addEventListener("submit", (event) => {
      event.preventDefault();
      const profile = {
        name: onboardingName.value.trim(),
        objectiveProfile: onboardingGoal.value,
        levelProfile: onboardingLevel.value,
        equipmentProfile: onboardingEquipment.value,
        sessionsWeekly: onboardingSessions.value
      };
      applyOnboardingProfile(profile);
      closeOnboardingModal();
      renderPlan(currentLanguage);
    });

    newGroupBtn.addEventListener("click", () => {
      createGroup(currentLanguage);
    });

    duplicateGroupBtn.addEventListener("click", () => {
      duplicateGroup(currentLanguage);
    });

    deleteGroupBtn.addEventListener("click", () => {
      deleteGroup(currentLanguage);
    });

    closePreviewBtn.addEventListener("click", closePreview);

    resetWeekBtn.addEventListener("click", () => {
      const t = translations[currentLanguage];
      if (confirm(t.resetConfirm)) {
        progressState = {};
        saveWeekProgress();
        renderPlan(currentLanguage);
      }
    });

    previewModal.addEventListener("click", (event) => {
      if (event.target === previewModal) {
        closePreview();
      }
    });

    document.addEventListener("keydown", (event) => {
      if (event.key === "Escape" && previewModal.classList.contains("open")) {
        closePreview();
        return;
      }

      if (event.key === "Escape" && settingsOverlay.classList.contains("open")) {
        closeSettingsPanel();
      }
    });


    const storedLanguage = localStorage.getItem("workout-language");
    const initialLanguage = storedLanguage && translations[storedLanguage] ? storedLanguage : "en";

    const storedTheme = localStorage.getItem("workout-theme");
    const initialTheme = storedTheme === "dark" ? "dark" : "light";

    currentWeekKey = getWeekKey();
    progressState = loadWeekProgress();
    exerciseChoices = loadExerciseChoices();
    collapsedDays = loadCollapsedDays();
    ensureWorkoutGroups();
    onboardingProfile = loadOnboardingProfile();

    applyTheme(initialTheme);
    renderPlan(initialLanguage);

    if (!onboardingProfile) {
      openOnboardingModal();
    }
  </script>
</body>
</html>
